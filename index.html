    if (!content) { canvas.hidden = true; $q('#qPh').hidden = false; acts(false); $q('#qInfo').textContent = ''; return; }
    try { qr = QR.encode(content, prefs.ecc); }
    catch (e) { setMsg(msg, e.message === 'TOO_LONG' ? 'İçerik QR koda sığmayacak kadar uzun. Metni kısaltın veya hata düzeltme düzeyini düşürün.' : 'QR kod oluşturulamadı.', 'err'); canvas.hidden = true; $q('#qPh').hidden = false; acts(false); return; }
    draw(); canvas.hidden = false; $q('#qPh').hidden = true; acts(true);
    const cr = contrast(parseHex(prefs.fg), parseHex(prefs.bg));
    if (cr < 3) setMsg(msg, 'Uyarı: Renkler arasındaki kontrast düşük; QR kod taranamayabilir.', 'warn');
    else if (lum(parseHex(prefs.fg)) > lum(parseHex(prefs.bg))) setMsg(msg, 'Not: Ön plan arka plandan açık; bazı okuyucular ters renkli kodları okuyamaz.', 'warn');
  }
  const blobOf = () => new Promise(r => canvas.toBlob(r, 'image/png'));
  $q('#qType').addEventListener('change', e => { type = e.target.value; renderFields(); update(); });
  root.addEventListener('input', debounce(update, 120));

  $q('#qPng').addEventListener('click', async () => { const b = await blobOf(); if (b) { downloadBlob(b, 'tektik-qr.png'); toast('PNG indirildi'); } });
  $q('#qSvg').addEventListener('click', () => {
    const b = prefs.border, n = qr.size + 2 * b; let d = '';
    for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) if (qr.modules[y][x]) d += `M${x + b} ${y + b}h1v1h-1z`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="${prefs.bg}"/><path d="${d}" fill="${prefs.fg}"/></svg>`;
    downloadText(svg, 'tektik-qr.svg', 'image/svg+xml');
  });
  $q('#qCopy').addEventListener('click', async () => {
    try { const b = await blobOf(); await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]); toast('QR görseli panoya kopyalandı'); }
    catch { toast('Tarayıcınız görseli kopyalamayı desteklemiyor. PNG olarak indirin.', 'err'); }
  });
  $q('#qShare').addEventListener('click', async () => { const b = await blobOf(); if (b) share({ title: 'TekTık QR kodu', files: [new File([b], 'tektik-qr.png', { type: 'image/png' })], text: 'TekTık ile oluşturulan QR kod' }); });
  renderFields();
}

function toolCount(root) {
  root.innerHTML = `
  <div class="panel">

    </div>
    <div class="stats" id="cStats" aria-live="polite"></div>

  const ta = $('#cText', root);
  let report = '';
  function calc() {
    const t = ta.value;
    const words = t.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || [];
    const chars = Array.from(t).length, noSpace = Array.from(t.replace(/\s/g, '')).length;
    const sentences = t.split(/[.!?…]+/).filter(s => /[\p{L}\p{N}]/u.test(s)).length;
    const paragraphs = t.split(/\n\s*\n/).filter(s => s.trim()).length;
    const lines = t ? t.split('\n').length : 0;
    const uniq = new Set(words.map(w => w.toLocaleLowerCase('tr'))).size;
    const mins = words.length / 200, talk = words.length / 130;
    const dur = m => !words.length ? '0 sn' : m < 1 ? Math.max(1, Math.round(m * 60)) + ' sn' : Math.round(m * 10) / 10 + ' dk';
    const rows = [['Kelime', fmtNum(words.length)], ['Karakter', fmtNum(chars)], ['Boşluksuz karakter', fmtNum(noSpace)], ['Cümle', fmtNum(sentences)], ['Paragraf', fmtNum(paragraphs)], ['Satır', fmtNum(lines)], ['Benzersiz kelime', fmtNum(uniq)], ['Okuma süresi', dur(mins)], ['Konuşma süresi', dur(talk)]];
    $('#cStats', root).innerHTML = rows.map(r => `<div class="stat"><b>${esc(r[1])}</b><span>${r[0]}</span></div>`).join('');
    report = 'TekTık — Metin istatistikleri\n' + rows.map(r => `${r[0]}: ${r[1]}`).join('\n');
    const freq = new Map();
    words.forEach(w => { const k = w.toLocaleLowerCase('tr'); if (k.length >= 3) freq.set(k, (freq.get(k) || 0) + 1); });
    const top = [...freq].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'tr')).slice(0, 6);
    const tbl = $('#cTop', root); tbl.textContent = '';
    if (!top.length) { const tr = tbl.insertRow(), td = tr.insertCell(); td.textContent = 'Henüz veri yok.'; td.style.textAlign = 'left'; }
    top.forEach(([w, n]) => { const tr = tbl.insertRow(); tr.insertCell().textContent = w; tr.insertCell().textContent = n + ' kez'; });
  }
  ta.addEventListener('input', calc);
  $('#cPaste', root).onclick = () => pasteInto(ta);
  $('#cCopy', root).onclick = () => copyText(ta.value);
  $('#cRep', root).onclick = () => copyText(report);
  $('#cDl', root).onclick = () => downloadText(report, 'tektik-istatistik.txt');
  $('#cClear', root).onclick = () => { ta.value = ''; calc(); ta.focus(); };
  calc();
}

/* ---------- 3) METİN DÖNÜŞTÜRÜCÜ ---------- */
function toolText(root) {
  const TR = { 'ç': 'c', 'Ç': 'C', 'ğ': 'g', 'Ğ': 'G', 'ı': 'i', 'İ': 'I', 'ö': 'o', 'Ö': 'O', 'ş': 's', 'Ş': 'S', 'ü': 'u', 'Ü': 'U' };
  const words = s => s.normalize('NFC').split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const cap = w => w.charAt(0).toLocaleUpperCase('tr') + w.slice(1);
  const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
  const b64dec = s => {
    const c = s.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    if (!c || !/^[A-Za-z0-9+/]*={0,2}$/.test(c) || c.length % 4 === 1) throw new Error('Geçersiz Base64 metni. Yalnızca A–Z, a–z, 0–9, +, / ve = karakterleri olmalı.');
    const bin = atob(c), bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch { throw new Error('Çözülen veri geçerli bir UTF-8 metni değil.'); }
  };
  const slug = s => s.replace(/[çÇğĞıİöÖşŞüÜ]/g, c => TR[c]).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const OPS = [
    ['Harf düzeni', [
      ['upper', 'BÜYÜK HARF', s => s.toLocaleUpperCase('tr')],
      ['lower', 'küçük harf', s => s.toLocaleLowerCase('tr')],
      ['title', 'Başlık Düzeni', s => s.toLocaleLowerCase('tr').replace(/(^|[\s\-–—("'])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase('tr'))],
      ['sentence', 'Cümle düzeni', s => s.toLocaleLowerCase('tr').replace(/(^\s*|[.!?…]\s+|\n\s*)(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase('tr'))],
      ['camel', 'camelCase', s => words(s).map((w, i) => i ? cap(w.toLocaleLowerCase('tr')) : w.toLocaleLowerCase('tr')).join('')],
      ['snake', 'snake_case', s => words(s).map(w => w.toLocaleLowerCase('tr')).join('_')],
      ['kebab', 'kebab-case', s => words(s).map(w => w.toLocaleLowerCase('tr')).join('-')]]],
    ['Temizleme', [
      ['spaces', 'Fazla boşlukları temizle', s => s.split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).join('\n').replace(/\n{3,}/g, '\n\n').trim()],
      ['notr', 'Türkçe karakterleri kaldır', s => s.replace(/[çÇğĞıİöÖşŞüÜ]/g, c => TR[c])],
      ['slug', 'URL dostu metin (slug)', slug],
      ['reverse', 'Tersine çevir', s => Array.from(s).reverse().join('')]]],
    ['Satırlar', [
      ['sort', 'Satırları A→Z sırala', s => s.split('\n').sort((a, b) => a.localeCompare(b, 'tr')).join('\n')],
      ['sortz', 'Satırları Z→A sırala', s => s.split('\n').sort((a, b) => b.localeCompare(a, 'tr')).join('\n')],
      ['dedupe', 'Tekrarlanan satırları sil', s => [...new Set(s.split('\n'))].join('\n')],
      ['number', 'Satır numaraları ekle', s => s.split('\n').map((l, i) => `${i + 1}. ${l}`).join('\n')],
      ['emptyl', 'Boş satırları sil', s => s.split('\n').filter(l => l.trim()).join('\n')]]],
    ['Kodlama', [
      ['b64e', 'Base64 kodla', b64enc],
      ['b64d', 'Base64 çöz', b64dec],
      ['urle', 'URL kodla', s => encodeURIComponent(s)],
      ['urld', 'URL kodunu çöz', s => { try { return decodeURIComponent(s); } catch { throw new Error('Geçersiz URL kodlaması. "%" işaretlerinin ardından iki onaltılık hane gelmelidir.'); } }]]]
  ];
  const flat = OPS.flatMap(g => g[1]);
  const prefs = store.get('textop', 'upper');
  root.innerHTML = `
  <div class="split">
    <div class="panel">
      <div class="field"><label for="tIn">Giriş metni</label><textarea id="tIn" style="min-height:180px" placeholder="Dönüştürmek istediğiniz metni yazın…"></textarea></div>
      <div class="field"><label for="tOp">Dönüşüm</label><select id="tOp">${OPS.map(g => `<optgroup label="${g[0]}">${g[1].map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</optgroup>`).join('')}</select></div>
      <div class="btns"><button class="btn" id="tPaste" type="button">Yapıştır</button><button class="btn" id="tClear" type="button">Temizle</button></div>
    </div>
    <div class="panel">
      <div class="field"><label for="tOut">Sonuç</label><textarea id="tOut" style="min-height:180px" readonly></textarea></div>
      <div id="tMsg" class="msg" role="alert"></div>
      <div class="btns">
        <button class="btn primary" id="tCopy" type="button">Kopyala</button>
        <button class="btn" id="tDl" type="button">İndir (.txt)</button>
        <button class="btn" id="tUse" type="button">Girişe taşı</button>
        <button class="btn" id="tShare" type="button">Paylaş</button>
      </div>
    </div>
  </div>`;
  const inp = $('#tIn', root), out = $('#tOut', root), op = $('#tOp', root), msg = $('#tMsg', root);
  op.value = flat.some(o => o[0] === prefs) ? prefs : 'upper';
  function run() {
    store.set('textop', op.value); setMsg(msg, '');
    if (!inp.value) { out.value = ''; return; }
    try { out.value = flat.find(o => o[0] === op.value)[2](inp.value); }
    catch (e) { out.value = ''; setMsg(msg, e.message || 'Dönüştürme sırasında bir hata oluştu.', 'err'); }
  }
  inp.addEventListener('input', run); op.addEventListener('change', run);
  $('#tPaste', root).onclick = () => pasteInto(inp);
  $('#tClear', root).onclick = () => { inp.value = ''; run(); inp.focus(); };
  $('#tCopy', root).onclick = () => copyText(out.value);
  $('#tDl', root).onclick = () => downloadText(out.value, 'tektik-metin.txt');
  $('#tUse', root).onclick = () => { if (!out.value) return toast('Taşınacak sonuç yok.', 'err'); inp.value = out.value; run(); toast('Sonuç girişe taşındı'); };
  $('#tShare', root).onclick = () => out.value ? share({ title: 'TekTık metin dönüştürücü', text: out.value }) : toast('Paylaşılacak sonuç yok.', 'err');
  run();
}

    if ((r = m.match(/line (\d+) column (\d+)/i))) { line = +r[1]; col = +r[2]; const L = src.split('\n'); pos = L.slice(0, line - 1).reduce((a, l) => a + l.length + 1, 0) + col - 1; }
    else if ((r = m.match(/position (\d+)/i))) { pos = +r[1]; const b = src.slice(0, pos).split('\n'); line = b.length; col = b[b.length - 1].length + 1; }
    let hint = 'Söz diziminde bir hata var.';
    if (/end of (json|data)|unexpected end/i.test(m)) hint = 'Metin beklenenden önce bitti; kapanmamış bir parantez, süslü parantez veya tırnak olabilir.';
    else if (/property name|double-quoted/i.test(m)) hint = 'Anahtarlar çift tırnak içinde olmalı ve sondaki fazla virgül kaldırılmalıdır.';

  }
  const sortKeys = v => Array.isArray(v) ? v.map(sortKeys) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort((a, b) => a.localeCompare(b, 'tr')).map(k => [k, sortKeys(v[k])])) : v;
  const depth = v => v && typeof v === 'object' ? 1 + Math.max(0, ...Object.values(v).map(depth)) : 0;
  const count = v => v && typeof v === 'object' ? Object.values(v).reduce((a, x) => a + count(x), 0) + Object.keys(v).length : 0;
  function parse() {

      const d = describe(e, src); errPos = d.pos; out.value = '';
      msg.className = 'msg err'; msg.textContent = d.text; const s = document.createElement('small'); s.textContent = 'Teknik ayrıntı: ' + d.tech; msg.appendChild(s);
      go.hidden = d.pos == null; return undefined;
    }
  }
  function okInfo(v, src) {
    const t = Array.isArray(v) ? 'dizi' : v === null ? 'null' : typeof v === 'object' ? 'nesne' : typeof v;
    setMsg(msg, `✓ Geçerli JSON — kök: ${t}, ${fmtNum(count(v))} öğe, derinlik ${depth(v)}, ${fmtBytes(new TextEncoder().encode(src).length)}`, 'ok');
  }
  function indentVal() { const i = $('#jInd', root).value; store.set('json', { indent: i }); return i === 'tab' ? '\t' : +i; }

  $('#jPaste', root).onclick = () => pasteInto(inp);
  $('#jClear', root).onclick = () => { inp.value = ''; out.value = ''; setMsg(msg, ''); go.hidden = true; inp.focus(); };
  $('#jSample', root).onclick = () => { inp.value = '{"uygulama":"TekTık","gelistirici":"SecureInf","araclar":["QR","JSON","Renk"],"ucretsiz":true,"surum":1.0}'; act('fmt'); };
  go.onclick = () => { if (errPos == null) return; inp.focus(); inp.setSelectionRange(errPos, Math.min(inp.value.length, errPos + 1)); };
  $('#jCopy', root).onclick = () => copyText(out.value);
  $('#jDl', root).onclick = () => downloadText(out.value, 'tektik.json', 'application/json');
  $('#jUse', root).onclick = () => { if (!out.value) return toast('Taşınacak sonuç yok.', 'err'); inp.value = out.value; toast('Sonuç girişe taşındı'); };

/* ---------- 5) HEX ⇄ RGB RENK DÖNÜŞTÜRÜCÜ ---------- */
function toolColor(root) {
  root.innerHTML = `
  <div class="split">
    <div class="panel">

  const $c = s => $(s, root);
  let rgb = [51, 102, 255];
  function sync(except) {
    const hex = toHex(rgb), hsl = rgbToHsl(rgb);
    if (except !== 'hex') $c('#clHex').value = hex;
    if (except !== 'rgb') $c('#clRgb').value = rgb.join(', ');

    const w = contrast(rgb, [255, 255, 255]), b = contrast(rgb, [0, 0, 0]);
    $c('#clSwT').style.color = w >= b ? '#fff' : '#000';

    $c('#clCon').innerHTML = `<div class="stat"><b>${w.toFixed(2).replace('.', ',')}:1</b><span>Beyaz metin · ${lvl(w)}</span></div><div class="stat"><b>${b.toFixed(2).replace('.', ',')}:1</b><span>Siyah metin · ${lvl(b)}</span></div>`;
    const sh = $c('#clShades'); sh.textContent = '';
    for (let i = 1; i <= 9; i++) {
      const c = hslToRgb([hsl[0], hsl[1], i * 10]), btn = document.createElement('button');
      btn.type = 'button'; btn.style.background = toHex(c); btn.setAttribute('aria-label', 'Ton ' + toHex(c)); btn.title = toHex(c);
      btn.onclick = () => { rgb = c; setMsg($c('#clMsg'), ''); sync(); }; sh.appendChild(btn);
    }
  }
  $c('#clPick').addEventListener('input', e => { rgb = parseHex(e.target.value); setMsg($c('#clMsg'), ''); sync(); });
  $c('#clHex').addEventListener('input', e => {

/* ---------- 6) CSS GRADIENT OLUŞTURUCU ---------- */
function toolGradient(root) {
  const PRESETS = [['Gün batımı', 'linear', 135, ['#ff512f', '#dd2476']], ['Okyanus', 'linear', 160, ['#2193b0', '#6dd5ed']], ['Orman', 'linear', 135, ['#134e5e', '#71b280']], ['Mor sis', 'linear', 120, ['#41295a', '#2f0743']], ['Siyah-beyaz', 'linear', 90, ['#000000', '#ffffff']], ['Neon', 'linear', 45, ['#00f5a0', '#00d9f5']], ['Güneş', 'radial', 0, ['#fff200', '#ff6a00']], ['Gökkuşağı', 'conic', 0, ['#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff0000']]];
  let st = store.get('grad', null);

  if (okSt) { st.stops = st.stops.filter(s => /^#[0-9a-f]{6}$/i.test(s.c) && Number.isFinite(+s.p)).slice(0, 6); st.angle = clamp(+st.angle || 0, 0, 360); }

  root.innerHTML = `
  <div class="split">
    <div class="panel">
      <div class="gprev" id="gPrev" role="img" aria-label="Gradient önizleme"></div>
      <div class="btns">
        <button class="btn" id="gRnd" type="button">Rastgele</button>

      </div>
      <div class="lbl" style="margin-top:14px">Hazır renk geçişleri</div>

    </div>
    <div class="panel">
      <div class="row">
        <div class="field"><label for="gType">Tür</label><select id="gType"><option value="linear">Doğrusal</option><option value="radial">Dairesel</option><option value="conic">Konik</option></select></div>
        <div class="field"><label for="gAng">Açı: <span id="gAngV"></span>°</label><input id="gAng" type="range" min="0" max="360"></div>
      </div>
      <div class="lbl">Renk durakları</div>
      <div id="gStops"></div>
      <div id="gMsg" class="msg" role="alert"></div>
      <div class="btns"><button class="btn sm" id="gAdd" type="button">+ Renk ekle</button></div>
      <div class="field" style="margin-top:14px"><label for="gCss">CSS kodu</label><textarea id="gCss" class="mono" readonly style="min-height:90px"></textarea></div>
      <div class="btns"><button class="btn primary" id="gCopy" type="button">CSS kopyala</button><button class="btn" id="gDl" type="button">CSS indir</button><button class="btn" id="gShare" type="button">Paylaş</button></div>
    </div>
  </div>`;
  const $g = s => $(s, root);
  const sorted = () => [...st.stops].sort((a, b) => a.p - b.p);
  const cssVal = () => {
    const s = sorted().map(x => `${x.c} ${x.p}%`).join(', ');
    return st.type === 'linear' ? `linear-gradient(${st.angle}deg, ${s})` : st.type === 'radial' ? `radial-gradient(circle at center, ${s})` : `conic-gradient(from ${st.angle}deg at center, ${s})`;
  };
  function refresh(keepList) {
    const g = cssVal();
    $g('#gPrev').style.background = g;
    $g('#gCss').value = `background: ${sorted()[0].c};\nbackground: ${g};`;
    $g('#gAngV').textContent = st.angle; $g('#gAng').value = st.angle; $g('#gAng').disabled = st.type === 'radial';
    $g('#gType').value = st.type; store.set('grad', st);
    if (!keepList) drawStops();
  }
  function drawStops() {
    const box = $g('#gStops'); box.textContent = '';
    st.stops.forEach((s, i) => {
      const r = document.createElement('div'); r.className = 'stop';
      const c = document.createElement('input'); c.type = 'color'; c.value = s.c; c.setAttribute('aria-label', `Renk ${i + 1}`);
      const p = document.createElement('input'); p.type = 'range'; p.min = 0; p.max = 100; p.value = s.p; p.setAttribute('aria-label', `Konum ${i + 1}`);
      const n = document.createElement('input'); n.type = 'number'; n.min = 0; n.max = 100; n.value = s.p; n.setAttribute('aria-label', `Konum yüzdesi ${i + 1}`);
      const d = document.createElement('button'); d.type = 'button'; d.className = 'btn sm'; d.textContent = '✕'; d.setAttribute('aria-label', `Rengi sil ${i + 1}`); d.disabled = st.stops.length <= 2;
      c.oninput = () => { s.c = c.value; refresh(true); };
      p.oninput = () => { s.p = +p.value; n.value = p.value; refresh(true); };
      n.oninput = () => { s.p = clamp(+n.value || 0, 0, 100); p.value = s.p; refresh(true); };
      d.onclick = () => { st.stops.splice(i, 1); refresh(); };
      r.append(c, p, n, d); box.appendChild(r);
    });
  }
  const rndHex = () => '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
  $g('#gType').onchange = e => { st.type = e.target.value; refresh(true); };
  $g('#gAng').oninput = e => { st.angle = +e.target.value; refresh(true); };
  $g('#gAdd').onclick = () => { if (st.stops.length >= 6) return setMsg($g('#gMsg'), 'En fazla 6 renk eklenebilir.', 'err'); setMsg($g('#gMsg'), ''); st.stops.push({ c: rndHex(), p: 100 }); refresh(); };
  $g('#gRnd').onclick = () => { const n = 2 + Math.floor(Math.random() * 2); st.stops = Array.from({ length: n }, (_, i) => ({ c: rndHex(), p: Math.round(i * 100 / (n - 1)) })); st.angle = Math.floor(Math.random() * 361); refresh(); };
  $g('#gRev').onclick = () => { st.stops = st.stops.map(s => ({ c: s.c, p: 100 - s.p })).reverse(); refresh(); };
  PRESETS.forEach(([name, type, angle, cols]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = name;
    b.onclick = () => { st = { type, angle, stops: cols.map((c, i) => ({ c, p: Math.round(i * 100 / (cols.length - 1)) })) }; setMsg($g('#gMsg'), ''); refresh(); };
    $g('#gPre').appendChild(b);
  });
  $g('#gCopy').onclick = () => copyText($g('#gCss').value, 'CSS kodu kopyalandı');
  $g('#gDl').onclick = () => downloadText($g('#gCss').value, 'tektik-gradient.css', 'text/css');
  $g('#gShare').onclick = () => share({ title: 'TekTık CSS gradient', text: $g('#gCss').value });
  $g('#gPng').onclick = () => {
    const W = 1600, H = 900, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); let g;
    const a = st.angle * Math.PI / 180;
    if (st.type === 'linear') { const len = Math.abs(W * Math.sin(a)) + Math.abs(H * Math.cos(a)), dx = Math.sin(a) * len / 2, dy = -Math.cos(a) * len / 2; g = x.createLinearGradient(W / 2 - dx, H / 2 - dy, W / 2 + dx, H / 2 + dy); }
    else if (st.type === 'radial') g = x.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W / 2, H / 2));
    else { if (!x.createConicGradient) return toast('Tarayıcınız konik gradient indirmeyi desteklemiyor.', 'err'); g = x.createConicGradient((st.angle - 90) * Math.PI / 180, W / 2, H / 2); }
    sorted().forEach(s => g.addColorStop(s.p / 100, s.c)); x.fillStyle = g; x.fillRect(0, 0, W, H);
    c.toBlob(b => { if (b) { downloadBlob(b, 'tektik-gradient.png'); toast('PNG indirildi'); } else toast('Görsel oluşturulamadı.', 'err'); });
  };
  refresh();
}

function toolImage(root) {

      <input id="iFile" type="file" accept="image/*" hidden>
    </div>
    <div id="iMsg" class="msg" role="alert"></div>
  </div>
  <div id="iWork" hidden>
    <div class="split">
      <div class="panel">
        <div class="stats" id="iOrig"></div>
        <div class="row" style="margin-top:14px">
          <div class="field"><label for="iW">Genişlik (px)</label><input id="iW" type="number" inputmode="numeric" min="1" max="8000"></div>
          <div class="field"><label for="iH">Yükseklik (px)</label><input id="iH" type="number" inputmode="numeric" min="1" max="8000"></div>

        <div class="row" style="margin-top:12px">
          <div class="field"><label for="iFmt">Biçim</label><select id="iFmt"><option value="image/jpeg">JPEG (en küçük)</option><option value="image/webp">WebP (modern)</option><option value="image/png">PNG (kayıpsız)</option></select></div>
          <div class="field"><label for="iQ">Kalite: <span id="iQV">80</span>%</label><input id="iQ" type="range" min="1" max="100" value="80"></div>
        </div>
      </div>
      <div class="panel">
        <img id="iPrev" class="imgprev" alt="Önizleme" hidden>
        <div class="stats" id="iRes"></div>
        <div id="iNote" class="msg" role="status"></div>
        <div class="btns"><button class="btn primary" id="iDl" type="button" disabled>İndir</button><button class="btn" id="iShare" type="button" disabled>Paylaş</button><button class="btn" id="iNew" type="button">Yeni görsel</button></div>
      </div>
    </div>
  </div>`;
  const $i = s => $(s, root);
  let img = null, file = null, outBlob = null, objUrl = null, prevUrl = null, token = 0, ratio = 1;
  const msg = $i('#iMsg'), drop = $i('#iDrop');
  const revoke = u => { if (u) URL.revokeObjectURL(u); };
  const stat = (v, l) => `<div class="stat"><b>${esc(v)}</b><span>${l}</span></div>`;
  function load(f) {
    setMsg(msg, '');
    if (!f) return;
    if (!f.type.startsWith('image/')) return setMsg(msg, 'Lütfen geçerli bir görsel dosyası seçin (JPG, PNG, WebP, GIF, BMP).', 'err');
    if (f.size > 40 * 1048576) return setMsg(msg, 'Dosya çok büyük. En fazla 40 MB boyutunda görsel seçin.', 'err');
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      if (!im.naturalWidth || !im.naturalHeight) { revoke(u); return setMsg(msg, 'Görselin boyutları okunamadı.', 'err'); }
      revoke(objUrl); objUrl = u; img = im; file = f; ratio = im.naturalWidth / im.naturalHeight;
      $i('#iWork').hidden = false;
      $i('#iW').value = im.naturalWidth; $i('#iH').value = im.naturalHeight;
      $i('#iOrig').innerHTML = stat(f.name.length > 18 ? f.name.slice(0, 15) + '…' : f.name, 'Dosya') + stat(fmtBytes(f.size), 'Orijinal boyut') + stat(`${im.naturalWidth}×${im.naturalHeight}`, 'Orijinal piksel');
      const isPng = f.type === 'image/png'; $i('#iFmt').value = isPng ? 'image/png' : 'image/jpeg';
      process();
    };
    im.onerror = () => { revoke(u); setMsg(msg, 'Bu görsel açılamadı. Dosya bozuk veya desteklenmeyen bir biçimde olabilir.', 'err'); };
    im.src = u;
  }
  async function process() {
    if (!img) return;
    const w = Math.round(+$i('#iW').value), h = Math.round(+$i('#iH').value), note = $i('#iNote');
    if (!(w >= 1 && h >= 1 && w <= 8000 && h <= 8000)) { setMsg(note, 'Genişlik ve yükseklik 1 ile 8000 piksel arasında olmalıdır.', 'err'); $i('#iDl').disabled = $i('#iShare').disabled = true; return; }

    setMsg(note, 'İşleniyor…');
    await new Promise(r => setTimeout(r, 15));
    let blob = null;
    try {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      if (fmt === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      blob = await new Promise(res => c.toBlob(res, fmt, q));
    } catch { blob = null; }
    if (my !== token) return;
    if (!blob) { outBlob = null; $i('#iDl').disabled = $i('#iShare').disabled = true; return setMsg(note, 'Görsel bu boyutta işlenemedi. Daha küçük bir boyut deneyin.', 'err'); }
    outBlob = blob; revoke(prevUrl); prevUrl = URL.createObjectURL(blob);
    const pv = $i('#iPrev'); pv.src = prevUrl; pv.hidden = false;
    const diff = Math.round((1 - blob.size / file.size) * 100);
    $i('#iRes').innerHTML = stat(fmtBytes(blob.size), 'Yeni boyut') + stat(`${w}×${h}`, 'Yeni piksel') + stat((diff >= 0 ? '−%' : '+%') + Math.abs(diff), diff >= 0 ? 'Tasarruf' : 'Artış');
    let text = '', type = 'ok';
    if (blob.type !== fmt) { text = 'Tarayıcınız seçilen biçimi desteklemiyor; PNG olarak üretildi.'; type = 'warn'; }
    else if (diff < 0) { text = 'Dosya boyutu arttı. Kaliteyi düşürmeyi, JPEG/WebP seçmeyi veya boyutu küçültmeyi deneyin.'; type = 'warn'; }
    else text = 'Hazır. Görsel cihazınızdan hiçbir yere gönderilmedi.';
    setMsg(note, text, type); $i('#iDl').disabled = $i('#iShare').disabled = false;
  }
  const schedule = debounce(process, 250);
  const ext = b => b.type === 'image/jpeg' ? 'jpg' : b.type === 'image/webp' ? 'webp' : 'png';
  const outName = () => (file.name.replace(/\.[^.]+$/, '') || 'gorsel') + '-tektik.' + ext(outBlob);
  drop.addEventListener('click', () => $i('#iFile').click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $i('#iFile').click(); } });
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });

  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); });

  $i('#iW').addEventListener('input', () => { if ($i('#iLock').checked && +$i('#iW').value > 0) $i('#iH').value = Math.max(1, Math.round($i('#iW').value / ratio)); schedule(); });

  $i('#iFmt').addEventListener('change', process);
  $i('#iQ').addEventListener('input', () => { $i('#iQV').textContent = $i('#iQ').value; schedule(); });
  [100, 75, 50, 25].forEach(p => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = '%' + p;
    b.onclick = () => { if (!img) return; $i('#iW').value = Math.max(1, Math.round(img.naturalWidth * p / 100)); $i('#iH').value = Math.max(1, Math.round(img.naturalHeight * p / 100)); process(); };
    $i('#iScale').appendChild(b);
  });
  $i('#iDl').onclick = () => { if (outBlob) { downloadBlob(outBlob, outName()); toast('Görsel indirildi'); } };
  $i('#iShare').onclick = () => { if (outBlob) share({ title: 'TekTık görsel', files: [new File([outBlob], outName(), { type: outBlob.type })] }); };
  $i('#iNew').onclick = () => $i('#iFile').click();
  return () => { revoke(objUrl); revoke(prevUrl); token++; };
}

  const U = {

    mass: ['Ağırlık', { mg: ['Miligram (mg)', 1e-6], g: ['Gram (g)', .001], kg: ['Kilogram (kg)', 1], t: ['Ton (t)', 1000], oz: ['Ons (oz)', .028349523125], lb: ['Pound (lb)', .45359237] }],
    temp: ['Sıcaklık', { c: ['Santigrat (°C)'], f: ['Fahrenheit (°F)'], k: ['Kelvin (K)'] }],

    area: ['Alan', { cm2: ['Santimetrekare (cm²)', 1e-4], m2: ['Metrekare (m²)', 1], don: ['Dönüm', 1000], ha: ['Hektar (ha)', 10000], km2: ['Kilometrekare (km²)', 1e6], ft2: ['Fitkare (ft²)', .09290304], ac: ['Akre (ac)', 4046.8564224] }],
    speed: ['Hız', { ms: ['Metre/saniye (m/s)', 1], kmh: ['Kilometre/saat (km/sa)', 1 / 3.6], mph: ['Mil/saat (mph)', .44704], kn: ['Knot (deniz mili/sa)', 1852 / 3600] }],
    data: ['Veri', { bit: ['Bit', .125], b: ['Bayt (B)', 1], kb: ['Kilobayt (KB = 1024 B)', 1024], mb: ['Megabayt (MB)', 1048576], gb: ['Gigabayt (GB)', 1073741824], tb: ['Terabayt (TB)', 1099511627776] }],
    time: ['Zaman', { ms: ['Milisaniye (ms)', .001], s: ['Saniye (sn)', 1], min: ['Dakika (dk)', 60], h: ['Saat (sa)', 3600], d: ['Gün', 86400], wk: ['Hafta', 604800], yr: ['Yıl (365 gün)', 31536000] }]
  };
  const toC = (u, v) => u === 'c' ? v : u === 'f' ? (v - 32) * 5 / 9 : v - 273.15;
  const fromC = (u, v) => u === 'c' ? v : u === 'f' ? v * 9 / 5 + 32 : v + 273.15;
  function convert(cat, from, to, v) {
    if (cat === 'temp') { const c = toC(from, v); if (c < -273.15 - 1e-9) throw new Error('Sıcaklık mutlak sıfırın (−273,15 °C) altında olamaz.'); return fromC(to, c); }
    const u = U[cat][1]; return v * u[from][1] / u[to][1];
  }
  function parseNum(s) {
    s = String(s).trim().replace(/\s/g, ''); if (!s) return NaN;
    if (s.includes(',') && s.includes('.')) { s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
    else s = s.replace(',', '.');
    return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s) ? Number(s) : NaN;
  }
  const fmt = n => { n = Number(n.toPrecision(12)); if (n === 0) return '0'; const a = Math.abs(n); return (a >= 1e15 || a < 1e-6) ? n.toExponential(6).replace('.', ',') : new Intl.NumberFormat('tr-TR', { maximumSignificantDigits: 10 }).format(n); };
  const prefs = Object.assign({ cat: 'length', from: 'm', to: 'km', val: '1' }, store.get('units', {}));
  if (!U[prefs.cat]) { prefs.cat = 'length'; prefs.from = 'm'; prefs.to = 'km'; }
  root.innerHTML = `

  </div>`;
  const $u = s => $(s, root);
  let resText = '';
  function fillUnits() {
    const opts = Object.entries(U[prefs.cat][1]).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('');
    $u('#uFrom').innerHTML = opts; $u('#uTo').innerHTML = opts;
    const keys = Object.keys(U[prefs.cat][1]);
    if (!keys.includes(prefs.from)) prefs.from = keys[0]; if (!keys.includes(prefs.to)) prefs.to = keys[1] || keys[0];
    $u('#uFrom').value = prefs.from; $u('#uTo').value = prefs.to;
  }
  function calc() {
    prefs.cat = $u('#uCat').value; prefs.from = $u('#uFrom').value; prefs.to = $u('#uTo').value; prefs.val = $u('#uVal').value; store.set('units', prefs);
    const msg = $u('#uMsg'), tbl = $u('#uAll'); tbl.textContent = '';
    const raw = $u('#uVal').value; setMsg(msg, ''); resText = '';
    if (!raw.trim()) { $u('#uRes').textContent = '—'; return; }
    const v = parseNum(raw);
    if (!Number.isFinite(v)) { $u('#uRes').textContent = '—'; return setMsg(msg, 'Lütfen geçerli bir sayı girin. Örnek: 12,5', 'err'); }
    try {
      const r = convert(prefs.cat, prefs.from, prefs.to, v), un = U[prefs.cat][1];
      resText = `${fmt(v)} ${un[prefs.from][0]} = ${fmt(r)} ${un[prefs.to][0]}`;
      $u('#uRes').textContent = fmt(r) + ' ' + un[prefs.to][0].replace(/^.*\((.*?)\).*$/, '$1');
      Object.keys(un).forEach(k => { const tr = tbl.insertRow(); tr.insertCell().textContent = un[k][0]; tr.insertCell().textContent = fmt(convert(prefs.cat, prefs.from, k, v)); });
    } catch (e) { $u('#uRes').textContent = '—'; setMsg(msg, e.message, 'err'); }
  }
  $u('#uCat').value = prefs.cat; fillUnits(); $u('#uVal').value = prefs.val;
  $u('#uCat').addEventListener('change', () => { prefs.cat = $u('#uCat').value; fillUnits(); calc(); });
  ['#uFrom', '#uTo'].forEach(s => $u(s).addEventListener('change', calc));
  $u('#uVal').addEventListener('input', calc);
  $u('#uSwap').onclick = () => { const a = $u('#uFrom').value; $u('#uFrom').value = $u('#uTo').value; $u('#uTo').value = a; calc(); };
  $u('#uCopy').onclick = () => copyText(resText);
  $u('#uShare').onclick = () => resText ? share({ title: 'TekTık birim dönüşümü', text: resText }) : toast('Paylaşılacak sonuç yok.', 'err');
  calc();
}

/* ---------- 9) ŞİFRE GÜCÜ KONTROL ARACI ---------- */
function toolPassword(root) {
  const COMMON = ['123456', '12345678', '123456789', '1234567', '12345', '1234', '654321', '000000', '111111', '123123', '123321', '5555', 'password', 'passw0rd', 'qwerty', 'qwerty123', 'abc123', 'abcd1234', '1q2w3e', '1q2w3e4r', 'asdfgh', 'zxcvbn', 'admin', 'welcome', 'letmein', 'iloveyou', 'dragon', 'monkey', 'football', 'master', 'login', 'test', 'sifre', 'sifrem', 'parola', 'merhaba', 'sevgilim', 'askim', 'canim', 'sevgi', 'ailem', 'kralbenim', 'istanbul', 'ankara', 'izmir', 'turkiye', 'galatasaray', 'fenerbahce', 'besiktas', 'trabzonspor', 'ataturk', '1453', '1923'];
  const ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm', '1234567890', 'qazwsxedc'];
  const COMMON_SET = new Set(COMMON);
  function analyze(pw) {
    const lower = /[a-zçğıöşü]/.test(pw), upper = /[A-ZÇĞİÖŞÜ]/.test(pw), digit = /\d/.test(pw), sym = /[^A-Za-z0-9çğıöşüÇĞİÖŞÜ\s]/.test(pw), space = /\s/.test(pw), other = /[^\x00-\x7F]/.test(pw.replace(/[çğıöşüÇĞİÖŞÜ]/g, ''));
    const pool = (lower ? 26 : 0) + (upper ? 26 : 0) + (digit ? 10 : 0) + (sym ? 33 : 0) + (space ? 1 : 0) + (other ? 100 : 0) + (/[çğıöşüÇĞİÖŞÜ]/.test(pw) ? 12 : 0);
    const n = norm(pw), base = n.replace(/[\d\W_]+$/, '');
    const common = COMMON_SET.has(n) || (base && COMMON_SET.has(base)) || COMMON.some(w => w.length >= 5 && n.includes(w) && n.length - w.length <= 4);
    let runs = 0, seq = 0;
    for (let i = 0; i < n.length;) { let j = i; while (j + 1 < n.length && n[j + 1] === n[i]) j++; if (j - i + 1 >= 3) runs += j - i; i = j + 1; }
    for (let i = 0; i + 2 < n.length; i++) {
      const a = n.charCodeAt(i), b = n.charCodeAt(i + 1), c = n.charCodeAt(i + 2);
      if ((b - a === 1 && c - b === 1) || (a - b === 1 && b - c === 1)) { seq++; continue; }
      const t = n.slice(i, i + 3);
      if (ROWS.some(r => r.includes(t) || r.split('').reverse().join('').includes(t))) seq++;
    }
    const uniq = new Set(n).size;
    let ent = pw.length * Math.log2(Math.max(pool, 2));
    ent -= runs * Math.log2(Math.max(pool, 2)) * .9; ent -= Math.min(seq, 6) * 5;
    if (n.length && uniq < n.length / 2) ent *= .8;
    if (common) ent = Math.min(ent, 12);
    ent = Math.max(0, ent);
    const score = !pw ? -1 : ent < 28 ? 0 : ent < 36 ? 1 : ent < 60 ? 2 : ent < 80 ? 3 : 4;
    return { len: pw.length, lower, upper, digit, sym: sym || space, common, runs, seq, ent, score, pool };
  }
  function crack(ent) {
    const s = Math.pow(2, ent) / 2 / 1e10;
    if (s < 1) return 'bir saniyeden kısa'; if (s < 60) return Math.round(s) + ' saniye'; if (s < 3600) return Math.round(s / 60) + ' dakika';
    if (s < 86400) return Math.round(s / 3600) + ' saat'; if (s < 2592000) return Math.round(s / 86400) + ' gün'; if (s < 31536000) return Math.round(s / 2592000) + ' ay';
    const y = s / 31536000; if (y < 1000) return Math.round(y) + ' yıl'; if (y < 1e6) return fmtNum(Math.round(y / 1000)) + ' bin yıl';
    if (y < 1e9) return fmtNum(Math.round(y / 1e6)) + ' milyon yıl'; if (y < 1e12) return fmtNum(Math.round(y / 1e9)) + ' milyar yıl'; return 'evrenin yaşından uzun';
  }
  const LABELS = ['Çok zayıf', 'Zayıf', 'Orta', 'Güçlü', 'Çok güçlü'], COLORS = ['var(--danger)', 'var(--danger)', 'var(--warn)', 'var(--ok)', 'var(--ok)'];
  const randInt = n => { const max = Math.floor(0x100000000 / n) * n; let x; do { x = crypto.getRandomValues(new Uint32Array(1))[0]; } while (x >= max); return x % n; };
  root.innerHTML = `
  <div class="split">
    <div class="panel">
      <div class="field"><label for="pwIn">Şifrenizi yazın</label>
        <div class="pw"><input id="pwIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Şifre"><button class="btn sm" id="pwShow" type="button" aria-pressed="false">Göster</button></div></div>
      <div class="msg" style="min-height:0">🔒 Şifreniz yalnızca tarayıcınızda değerlendirilir; hiçbir yere gönderilmez veya kaydedilmez.</div>
      <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" aria-label="Şifre gücü" id="pwMeter"><i id="pwBar"></i></div>
      <div><b id="pwLabel">Şifre girin</b> <span class="lbl" id="pwEnt"></span></div>
      <div class="msg" id="pwCrack"></div>
      <ul class="checks" id="pwChecks"></ul>
      <div class="msg" id="pwTips"></div>
    </div>
    <div class="panel">
      <div class="lbl">Güçlü şifre oluşturucu</div>
      <div class="field"><label for="gLen">Uzunluk: <span id="gLenV">16</span></label><input id="gLen" type="range" min="8" max="64" value="16"></div>
      <label class="check"><input type="checkbox" id="gLow" checked> Küçük harf</label>
      <label class="check"><input type="checkbox" id="gUp" checked> Büyük harf</label>
      <label class="check"><input type="checkbox" id="gDig" checked> Rakam</label>
      <label class="check"><input type="checkbox" id="gSym" checked> Sembol</label>
      <label class="check"><input type="checkbox" id="gAmb"> Benzer karakterleri çıkar (0 O 1 l I)</label>
      <div id="gMsg" class="msg" role="alert"></div>
      <div class="btns"><button class="btn primary" id="gGen" type="button">Oluştur ve kontrol et</button><button class="btn" id="gCopy" type="button">Şifreyi kopyala</button></div>
    </div>
  </div>`;
  const $p = s => $(s, root), inp = $p('#pwIn');
  function update() {
    const a = analyze(inp.value), bar = $p('#pwBar'), checks = $p('#pwChecks'), tips = $p('#pwTips');
    checks.textContent = ''; tips.textContent = '';
    $p('#pwMeter').setAttribute('aria-valuenow', Math.max(0, a.score));
    if (a.score < 0) { bar.style.width = '0'; $p('#pwLabel').textContent = 'Şifre girin'; $p('#pwEnt').textContent = ''; $p('#pwCrack').textContent = ''; return; }
    bar.style.width = ((a.score + 1) * 20) + '%'; bar.style.background = COLORS[a.score];
    $p('#pwLabel').textContent = LABELS[a.score]; $p('#pwEnt').textContent = `≈ ${Math.round(a.ent)} bit`;
    $p('#pwCrack').className = 'msg'; $p('#pwCrack').textContent = `Hızlı bir saldırıda tahmini kırılma süresi: ${crack(a.ent)}`;
    const list = [[a.len >= 12, 'En az 12 karakter'], [a.lower, 'Küçük harf'], [a.upper, 'Büyük harf'], [a.digit, 'Rakam'], [a.sym, 'Sembol'], [!a.common, 'Yaygın bir şifre/kelime değil'], [a.runs === 0, 'Tekrarlayan karakter yok'], [a.seq === 0, 'Ardışık / klavye dizisi yok']];
    list.forEach(([ok, t]) => { const li = document.createElement('li'); li.className = ok ? 'ok' : ''; const b = document.createElement('b'); b.textContent = ok ? '✓' : '✗'; li.append(b, document.createTextNode(t)); checks.appendChild(li); });
    const tp = []; if (a.common) tp.push('Bu şifre ya da kalıbı çok yaygın; tamamen farklı bir şifre seçin.'); if (a.len < 12) tp.push('Uzunluğu artırmak gücü en çok yükselten adımdır.'); if (a.seq) tp.push('123, abc ya da qwe gibi dizilerden kaçının.'); if (a.runs) tp.push('Aynı karakteri art arda tekrarlamayın.');
    tips.textContent = tp.join(' ');
  }
  inp.addEventListener('input', update);
  $p('#pwShow').onclick = e => { const h = inp.type === 'password'; inp.type = h ? 'text' : 'password'; e.target.textContent = h ? 'Gizle' : 'Göster'; e.target.setAttribute('aria-pressed', String(h)); };
  $p('#gLen').addEventListener('input', () => { $p('#gLenV').textContent = $p('#gLen').value; });
  $p('#gGen').onclick = () => {
    const amb = $p('#gAmb').checked, rm = s => amb ? s.replace(/[0O1lI]/g, '') : s;
    const sets = [];
    if ($p('#gLow').checked) sets.push(rm('abcdefghijklmnopqrstuvwxyz'));
    if ($p('#gUp').checked) sets.push(rm('ABCDEFGHIJKLMNOPQRSTUVWXYZ'));
    if ($p('#gDig').checked) sets.push(rm('0123456789'));
    if ($p('#gSym').checked) sets.push('!@#$%^&*()-_=+[]{};:,.?/');
    if (!sets.length) return setMsg($p('#gMsg'), 'En az bir karakter türü seçin.', 'err');
    setMsg($p('#gMsg'), '');
    const len = +$p('#gLen').value, all = sets.join(''), chars = sets.map(s => s[randInt(s.length)]);
    while (chars.length < len) chars.push(all[randInt(all.length)]);
    for (let i = chars.length - 1; i > 0; i--) { const j = randInt(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
    inp.value = chars.slice(0, len).join(''); inp.type = 'text'; $p('#pwShow').textContent = 'Gizle'; $p('#pwShow').setAttribute('aria-pressed', 'true'); update();
  };
  $p('#gCopy').onclick = () => copyText(inp.value, 'Şifre kopyalandı');
  update();
}

/* ---------- 10) YEREL NOT DEFTERİ ---------- */
function toolNotes(root) {
  let notes = store.get('notes', []); if (!Array.isArray(notes)) notes = [];
  notes = notes.filter(n => n && typeof n.id === 'string').map(n => ({ id: n.id, title: String(n.title || ''), body: String(n.body || ''), t: +n.t || Date.now() }));
  let cur = store.get('notesCur', null), q = '';
  root.innerHTML = `
  <div class="notes-layout">
    <div class="panel">
      <div class="btns" style="margin:0 0 10px"><button class="btn primary" id="nNew" type="button">+ Yeni not</button></div>
      <input id="nSearch" type="search" placeholder="Notlarda ara…" aria-label="Notlarda ara" autocomplete="off">
      <ul class="nlist" id="nList"></ul>
      <div class="btns"><button class="btn sm" id="nExp" type="button">Dışa aktar</button><button class="btn sm" id="nImp" type="button">İçe aktar</button><input id="nFile" type="file" accept="application/json,.json" hidden></div>
      <div id="nMsg" class="msg" role="alert"></div>
    </div>
    <div class="panel">
      <div id="nEmpty" class="empty">Henüz not yok. Başlamak için <b>Yeni not</b> düğmesine dokunun.</div>
      <div id="nEd" hidden>
        <div class="field"><label for="nTitle">Başlık</label><input id="nTitle" maxlength="120" autocomplete="off" placeholder="Başlık"></div>
        <div class="field"><label for="nBody">Not</label><textarea id="nBody" style="min-height:260px" placeholder="Notunuzu yazın… Değişiklikler otomatik kaydedilir."></textarea></div>
        <div class="lbl" id="nStat" role="status" aria-live="polite"></div>
        <div class="btns"><button class="btn" id="nCopy" type="button">Kopyala</button><button class="btn" id="nDl" type="button">İndir (.txt)</button><button class="btn" id="nShare" type="button">Paylaş</button><button class="btn" id="nDel" type="button">Sil</button></div>
      </div>
    </div>
  </div>`;
  const $n = s => $(s, root), msg = $n('#nMsg');
  const find = () => notes.find(n => n.id === cur);
  const label = n => n.title.trim() || n.body.trim().split('\n')[0].slice(0, 60) || 'Başlıksız not';
  function persist() {
    const ok = store.set('notes', notes); store.set('notesCur', cur);
    if (!ok) { setMsg(msg, 'Notlar kaydedilemedi: tarayıcı depolaması kullanılamıyor (gizli mod veya dolu depolama olabilir).', 'err'); return false; }
    setMsg(msg, ''); return true;
  }
  function renderList() {
    const ul = $n('#nList'); ul.textContent = '';
    const nq = norm(q), list = [...notes].sort((a, b) => b.t - a.t).filter(n => !nq || norm(n.title + ' ' + n.body).includes(nq));
    if (!list.length) { const li = document.createElement('li'); li.className = 'lbl'; li.textContent = q ? 'Eşleşen not bulunamadı.' : ''; ul.appendChild(li); }
    list.forEach(n => {
      const li = document.createElement('li'), b = document.createElement('button'), t = document.createElement('b'), s = document.createElement('small');
      b.type = 'button'; if (n.id === cur) b.setAttribute('aria-current', 'true');
      t.textContent = label(n); s.textContent = new Date(n.t).toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });
      b.append(t, s); b.onclick = () => { cur = n.id; store.set('notesCur', cur); renderAll(true); }; li.appendChild(b); ul.appendChild(li);
    });
  }
  function renderEditor(focus) {
    const n = find(); $n('#nEmpty').hidden = !!n; $n('#nEd').hidden = !n;
    if (n) { $n('#nTitle').value = n.title; $n('#nBody').value = n.body; $n('#nStat').textContent = 'Son değişiklik: ' + new Date(n.t).toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' }); if (focus) $n('#nBody').focus({ preventScroll: false }); }
  }
  function renderAll(focus) { if (!find()) cur = notes.length ? [...notes].sort((a, b) => b.t - a.t)[0].id : null; renderList(); renderEditor(focus); }
  const save = debounce(() => {
    const n = find(); if (!n) return; n.title = $n('#nTitle').value; n.body = $n('#nBody').value; n.t = Date.now();
    if (persist()) $n('#nStat').textContent = 'Kaydedildi · ' + new Date(n.t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    renderList();
  }, 350);
  $n('#nTitle').addEventListener('input', save); $n('#nBody').addEventListener('input', save);
  $n('#nSearch').addEventListener('input', e => { q = e.target.value; renderList(); });
  $n('#nNew').onclick = () => { const n = { id: uid(), title: '', body: '', t: Date.now() }; notes.push(n); cur = n.id; persist(); renderAll(true); $n('#nTitle').focus(); };
  $n('#nDel').onclick = () => { const n = find(); if (!n) return; if (!confirm('Bu not kalıcı olarak silinsin mi?')) return; notes = notes.filter(x => x.id !== n.id); cur = null; persist(); renderAll(); toast('Not silindi'); };
  const text = () => { const n = find(); return n ? (n.title ? n.title + '\n\n' : '') + n.body : ''; };
  $n('#nCopy').onclick = () => copyText(text());
  $n('#nDl').onclick = () => downloadText(text(), (find() ? (norm(label(find())).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'not') : 'not') + '.txt');
  $n('#nShare').onclick = () => text() ? share({ title: label(find()), text: text() }) : toast('Paylaşılacak içerik yok.', 'err');
  $n('#nExp').onclick = () => notes.length ? downloadText(JSON.stringify({ app: 'TekTık', notes }, null, 2), 'tektik-notlar.json', 'application/json') : toast('Dışa aktarılacak not yok.', 'err');
  $n('#nImp').onclick = () => $n('#nFile').click();
  $n('#nFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text()), arr = Array.isArray(data) ? data : data.notes;
      if (!Array.isArray(arr)) throw new Error('x');
      const add = arr.filter(n => n && (typeof n.body === 'string' || typeof n.title === 'string')).map(n => ({ id: uid(), title: String(n.title || ''), body: String(n.body || ''), t: +n.t || Date.now() }));
      if (!add.length) throw new Error('x');
      notes.push(...add); persist(); renderAll(); toast(add.length + ' not içe aktarıldı');
    } catch { setMsg(msg, 'İçe aktarılamadı. Lütfen TekTık\'tan dışa aktarılmış geçerli bir .json dosyası seçin.', 'err'); }
  });
  renderAll();
}

    `<button type="button" class="fav${on ? ' on' : ''}" data-fav="${t.id}" aria-pressed="${on}" aria-label="${t.name} ${on ? 'favorilerden çıkar' : 'favorilere ekle'}" title="${on ? 'Favorilerden çıkar' : 'Favorilere ekle'}">${icon('star')}</button></article>`;
};
const section = (title, tools, extra = '') => `<section class="sec"><h2>${title}<span class="n">${tools.length}${extra}</span></h2><div class="grid">${tools.map(cardHTML).join('')}</div></section>`;
const adHTML = name => `<div class="ad-slot sec" data-slot="${name}" hidden aria-label="Reklam alanı"></div>`;

function renderChips() {
  const all = ['Tümü', 'Favoriler', ...CATS];
  $('#chips').innerHTML = all.map(c => `<button type="button" class="chip" data-cat="${c}" aria-pressed="${state.cat === c}">${c}${c === 'Favoriler' && favs.length ? ' (' + favs.length + ')' : ''}</button>`).join('');
}
function renderLists() {
  const box = $('#lists'), q = norm(state.q.trim()), tools = LIST();
  let html = '';
  const match = t => !q || norm(`${t.name} ${t.desc} ${t.cat} ${t.kw}`).includes(q);
  if (!q && state.cat === 'Tümü') {
    const fl = favs.map(id => tools.find(t => t.id === id)).filter(Boolean), rl = recent.map(id => tools.find(t => t.id === id)).filter(Boolean).slice(0, 4);
    if (fl.length) html += section('★ Favorilerim', fl);
    if (rl.length) html += section('Son kullanılanlar', rl);
    html += section('Popüler araçlar', tools.filter(t => t.popular));
    html += adHTML('homeMid');
    html += section('Tüm araçlar', tools);
  } else {
    let res = tools.filter(match);
    if (state.cat === 'Favoriler') res = res.filter(t => favs.includes(t.id)); else if (state.cat !== 'Tümü') res = res.filter(t => t.cat === state.cat);
    if (res.length) html = section(q ? 'Arama sonuçları' : state.cat, res);
    else if (state.cat === 'Favoriler' && !q) html = '<div class="empty sec">Henüz favori araç eklemediniz. Araç kartlarındaki yıldıza dokunarak ekleyin.</div>';
    else html = `<div class="empty sec">${q ? `“${esc(state.q.trim())}” için araç bulunamadı.` : 'Bu kategoride araç yok.'} Farklı bir anahtar kelime veya kategori deneyin.</div>`;
  }
  box.innerHTML = html;
  mountAds(box);
}
function toggleFav(id) {
  favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
  store.set('favs', favs); toast(favs.includes(id) ? 'Favorilere eklendi' : 'Favorilerden çıkarıldı');
  renderChips();
  if (!$('#home').hidden) renderLists();
  else { const b = $('#toolFav'); if (b) { const on = favs.includes(id); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? 'Favorilerden çıkar' : 'Favorilere ekle'); } }
}
/* Reklamlar: her alan kendi izole (sandbox) iframe'inde yüklenir.
   Böylece reklam betiği sayfayı/verileri göremez, birden çok reklam çakışmaz,
   yüklenemezse (reklam engelleyici vb.) boş kalır ve arayüz bozulmaz. */
const adFit = a => {
  const inner = a.firstElementChild, f = inner && inner.firstElementChild;
  if (!f) return;
  const s = Math.min(1, a.clientWidth / CONFIG.ads.w);
  inner.style.height = Math.round(CONFIG.ads.h * s) + 'px';
  f.style.transform = `scale(${s})`;
  f.style.left = Math.max(0, (a.clientWidth - CONFIG.ads.w * s) / 2) + 'px';
};
const adRO = 'ResizeObserver' in window ? new ResizeObserver(es => es.forEach(e => adFit(e.target))) : null;
function mountAds(root) {
  $$('.ad-slot', root).forEach(a => {
    if (!CONFIG.ads.enabled || !/^https:\/\//.test(CONFIG.ads.src)) { a.hidden = true; return; }
    if (a.dataset.ready) { a.hidden = false; return; }
    a.dataset.ready = '1'; a.hidden = false;
    const { key, src, w, h } = CONFIG.ads;
    const inner = document.createElement('div'); inner.className = 'ad-in';
    const f = document.createElement('iframe');
    f.title = 'Reklam'; f.loading = 'lazy'; f.referrerPolicy = 'no-referrer-when-downgrade';
    f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
    f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style></head><body>' +
      '<script>atOptions={"key":"' + key + '","format":"iframe","height":' + h + ',"width":' + w + ',"params":{}};<\/script>' +
      '<script src="' + src + '"><\/script></body></html>';
    inner.appendChild(f); a.appendChild(inner); adFit(a);
    if (adRO) adRO.observe(a);
  });
}
function showHome() {
  if (cleanup) { cleanup(); cleanup = null; }
  $('#toolView').hidden = true; $('#toolView').textContent = ''; $('#home').hidden = false;
  document.title = 'TekTık — İhtiyacın olan her araç, tek tık uzağında';
  renderChips(); renderLists(); mountAds($('#home')); mountAds($('footer'));
}
function showTool(t) {
  if (cleanup) { cleanup(); cleanup = null; }
  recent = [t.id, ...recent.filter(x => x !== t.id)].slice(0, 6); store.set('recent', recent);
  $('#home').hidden = true;
  const view = $('#toolView'); view.hidden = false;
  const on = favs.includes(t.id), related = LIST().filter(x => x.id !== t.id && x.cat === t.cat).concat(LIST().filter(x => x.id !== t.id && x.cat !== t.cat)).slice(0, 3);
  view.innerHTML = `
    <div class="tool-head">
      <a class="back" href="#/">${icon('back')} Tüm araçlar</a>
    </div>
    <div class="tool-head" style="padding-top:0">
      <div class="tool-title"><span class="ico">${icon(t.icon)}</span><div><h1 id="toolH" tabindex="-1">${t.name}</h1><p>${t.desc}</p></div></div>
      <div class="tool-actions">
        <button type="button" id="toolFav" class="icon-btn fav${on ? ' on' : ''}" style="position:static" data-fav="${t.id}" aria-pressed="${on}" aria-label="${on ? 'Favorilerden çıkar' : 'Favorilere ekle'}">${icon('star')}</button>
        <button type="button" id="toolShare" class="icon-btn" aria-label="Aracı paylaş">${icon('share')}</button>
      </div>
    </div>
    <div class="ad-slot" data-slot="toolTop" hidden aria-label="Reklam alanı" style="margin-top:6px"></div>
    <div class="tool-body" id="toolBody"></div>
    <div class="ad-slot" data-slot="toolBottom" hidden aria-label="Reklam alanı"></div>
    <section class="sec"><h2>Diğer araçlar</h2><div class="grid">${related.map(cardHTML).join('')}</div></section>`;
  document.title = t.name + ' — TekTık';
  $('#toolShare').onclick = () => share({ title: t.name + ' — TekTık', text: t.desc, url: location.href.split('#')[0] + '#/arac/' + t.id });
  try { const c = t.render($('#toolBody')); if (typeof c === 'function') cleanup = c; }
  catch (e) { console.error(e); $('#toolBody').innerHTML = '<div class="empty">Bu araç yüklenirken bir sorun oluştu. Sayfayı yenileyip tekrar deneyin.</div>'; }
  mountAds(view); mountAds($('footer')); window.scrollTo(0, 0); $('#toolH').focus({ preventScroll: true });
}
function route() {
  const m = location.hash.match(/^#\/arac\/([\w-]+)/), t = m && LIST().find(x => x.id === m[1]);
  if (t) showTool(t); else { if (m) history.replaceState(null, '', '#/'); showHome(); window.scrollTo(0, 0); }
}

/* tema */
function applyTheme(th, save) {
  document.documentElement.setAttribute('data-theme', th);
  $('#themeBtn').innerHTML = th === 'dark' ? icon('sun') : icon('moon');
  $('#themeBtn').setAttribute('aria-label', th === 'dark' ? 'Açık temaya geç' : 'Karanlık temaya geç');
  const meta = $('meta[name=theme-color]'); if (meta) meta.setAttribute('content', th === 'dark' ? '#000000' : '#ffffff');
  if (save) store.set('theme', th);
}

/* olaylar */
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]'); if (f) { e.preventDefault(); toggleFav(f.dataset.fav); return; }
  const c = e.target.closest('[data-cat]'); if (c) { state.cat = c.dataset.cat; store.set('cat', state.cat); renderChips(); renderLists(); }
});
$('#q').addEventListener('input', debounce(e => { state.q = e.target.value; renderLists(); }, 120));
$('#themeBtn').addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true));
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !$('#home').hidden) { e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('hashchange', route);

applyTheme(store.get('theme', 'dark') === 'light' ? 'light' : 'dark', false);
if (!['Tümü', 'Favoriler', ...CATS].includes(state.cat)) state.cat = 'Tümü';
route();

window.TekTik = { version: '1.0.0', developer: 'SecureInf', tools: TOOLS.map(t => t.id) };
})();
</script>
</body>
</html>
